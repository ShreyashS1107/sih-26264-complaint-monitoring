services:
  postgres:
    image: postgres:16-alpine
    container_name: sih26264-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-sih26264_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sih26264_test}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sih26264-network

  # Application container using the Docker service name 'postgres' as database host
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sih26264-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgres:5432/${POSTGRES_DB:-sih26264_test}?schema=public
    ports:
      - "3000:3000"
    networks:
      - sih26264-network
    profiles:
      - full-stack

volumes:
  postgres_data:
    name: sih26264_postgres_data

networks:
  sih26264-network:
    name: sih26264-network
